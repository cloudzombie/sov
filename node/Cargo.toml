[package]
name = "sov-station"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Native SOV wallet and mining-node operator station."

[dependencies]
sov-primitives = { path = "../chain/crates/primitives" }
sov-rpc = { path = "../chain/crates/rpc" }
sov-crypto = { path = "../chain/crates/crypto" }
sov-wallet = { path = "../chain/crates/wallet" }
sov-shielded = { path = "../chain/crates/shielded" }
# Pool v2 (post-quantum) key derivation, so the Receive view can show the
# `xusq1…` address a wallet's seed controls. READ-ONLY use: the deployment is
# dormant (signal bit 2 unarmed), so the station derives and displays the
# address but can never build a v2 spend.
sov-shielded-pq = { path = "../chain/crates/shielded-pq" }
# UPnP port mapping: Station runs the node IN-PROCESS, so it needs to ask the
# router for a mapping itself rather than inheriting one from sov-rpcd.
sov-network = { path = "../chain/crates/network" }
sov-types = { path = "../chain/crates/types" }
# The blockspace auction's rules — `MIN_RBF_BUMP_GRAINS` and `effective_tip` — are
# READ from the mempool that enforces them rather than restated here, so a wallet
# can never compute a replacement price the network refuses. Already in this
# binary's graph (sov-rpc → sov-chain → sov-mempool); this only makes the
# dependency the code actually has an explicit one.
sov-mempool = { path = "../chain/crates/mempool" }
# The gas schedule, for the one figure `sov_estimateFee` cannot express: the extra
# gas a `Tipped` envelope costs on top of the bare route. Read from the schedule
# consensus charges, not guessed. Already in this binary's graph (sov-rpc →
# sov-runtime).
sov-runtime = { path = "../chain/crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native GUI: the `sov-station` desktop window (cross-platform — macOS, Windows,
# Linux). Pure-Rust immediate-mode UI; no web stack, no JS, a single binary.
eframe = "0.29"
# QR encoding for the Receive view (matrix only — no image/svg backends pulled in;
# rendered directly with the egui painter).
qrcode = { version = "0.14", default-features = false }
# SHA-256 for HTLC hashlocks (preimage → hashlock) in the Swaps tab.
sha2 = "0.10"
# AEAD for the encrypted, incremental shielded note cache (same crate the node
# keystore uses), keyed by the device key.
chacha20poly1305 = "0.10"
# Memory hygiene for wallet secrets: wipe seed / mnemonic / passphrase on drop so
# they don't linger in freed memory, swap, or a core dump.
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
