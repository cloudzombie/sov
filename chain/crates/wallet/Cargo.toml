[package]
name = "sov-wallet"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SOV key management and transaction building: holds keypairs and constructs signed transactions."

[dependencies]
sov-primitives = { path = "../primitives" }
sov-crypto = { path = "../crypto" }
sov-types = { path = "../types" }
thiserror.workspace = true
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# For the zero-consensus-surface proof: a transfer built from an `xust1…`
# recipient must be BYTE-IDENTICAL on the wire to one built from raw hex.
sov-shielded = { path = "../shielded" }
borsh.workspace = true
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
