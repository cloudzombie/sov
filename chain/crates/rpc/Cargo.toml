[package]
name = "sov-rpc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "JSON-RPC server for a SOV node (std-only HTTP) plus a known-answer-test vector generator for the JS/TS SDK."

[dependencies]
# Graceful shutdown. `unsafe_code = "forbid"` in this crate means a signal
# handler cannot be written here directly, and a node that can only be killed
# is a node that leaves work half-finished: an unflushed mempool, and a UPnP
# mapping the router keeps forwarding to nothing. One small, widely-reviewed
# crate is a better answer than either relaxing the unsafe policy or shipping
# an ungraceful daemon.
ctrlc = { version = "3", features = ["termination"] }
sov-primitives = { path = "../primitives" }
sov-crypto = { path = "../crypto" }
sov-types = { path = "../types" }
sov-state = { path = "../state" }
sov-intents = { path = "../intents" }
sov-chain = { path = "../chain" }
sov-governance = { path = "../governance" }
sov-node = { path = "../node" }
sov-network = { path = "../network" }
sov-mining = { path = "../mining" }
sov-pow = { path = "../pow" }
sov-runtime = { path = "../runtime" }
sov-shielded = { path = "../shielded" }
sov-shielded-pq = { path = "../shielded-pq" }
sov-wallet = { path = "../wallet" }
borsh.workspace = true
hex.workspace = true
sha2 = "0.10"
wat = "1"
getrandom = "0.2"
bip39 = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
